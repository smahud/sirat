  #     - -c
  #     - |
  #       while true; do
  #         TS=$$(date +%Y%m%d-%H%M%S)
  #         pg_dump -h db -U sirat sirat > /backups/db-$$TS.dump
  #         tar -czf /backups/archive-$$TS.tar.gz -C /archive .
  #         find /backups -mtime +7 -delete
  #         sleep 86400
